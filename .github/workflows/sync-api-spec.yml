name: Sync API Spec

on:
    repository_dispatch:
        types: [api-release]
    workflow_dispatch:

permissions:
    contents: write
    id-token: write

jobs:
    sync:
        name: Sync and Rebuild Docs
        runs-on: ubuntu-latest
        environment: production
        permissions:
            contents: write
            packages: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                  role-to-assume: arn:aws:iam::013292575751:role/github-action-role
                  aws-region: us-east-2

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # --archive-previous: when this release is a new API version, the
            # previously published latest is added to api-versions.json so it
            # stays available in the docs version picker, and its pinned
            # artifacts are fetched for the versioned reference build.
            - name: Download public release artifacts from S3
              run: bash scripts/fetch-public-release-artifacts.sh --archive-previous "${{ github.event.client_payload.api_version || '' }}"

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.22'

            - name: Install dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build docs
              run: bun run build:docs

            - name: Check for changes
              id: diff
              run: |
                  # --porcelain (not `git diff`) so brand-new untracked files —
                  # e.g. src/static/api-versions/<version>/ for a newly archived
                  # version — also count as changes.
                  if [ -z "$(git status --porcelain)" ]; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    echo "No changes after build — skipping commit."
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Commit and push
              if: steps.diff.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  API_VERSION="${{ github.event.client_payload.api_version || 'manual' }}"
                  git commit -m "chore: rebuild docs from API ${API_VERSION}"
                  git push
