name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    build:
        name: Build & Validate
        runs-on: ubuntu-latest
        # No `environment:` here. This job builds and validates; it deploys nothing, and the only
        # secret it uses is the built-in GITHUB_TOKEN. Declaring the production environment put it
        # behind that environment's main-only branch policy, so every pull request failed before it
        # could read the spec from S3.
        permissions:
            contents: read
            packages: read
            id-token: write

        # Pull requests from forks receive no secrets and cannot assume the AWS role,
        # so the spec-dependent steps are skipped for them. The committed
        # src/static/*.generated.ts files still allow a full lint and build.
        env:
            TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS Credentials
              if: env.TRUSTED == 'true'
              uses: aws-actions/configure-aws-credentials@v3
              with:
                  role-to-assume: arn:aws:iam::013292575751:role/github-actions-spec-reader
                  aws-region: us-east-2

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Download public release artifacts from S3
              if: env.TRUSTED == 'true'
              run: bash scripts/fetch-public-release-artifacts.sh

            - name: Generate docs
              if: env.TRUSTED == 'true'
              run: bun run build:docs

            - name: Validate pathKeys
              run: bun run validate:pathkeys

            - name: Lint
              run: bun run lint

            - name: Build
              run: bun run build
