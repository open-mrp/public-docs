name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    build:
        name: Build & Validate
        runs-on: ubuntu-latest
        environment: production
        permissions:
            contents: read
            packages: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                  role-to-assume: arn:aws:iam::013292575751:role/github-action-role
                  aws-region: us-east-2

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.22'

            - name: Install dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Download public release artifacts from S3
              run: bash scripts/fetch-public-release-artifacts.sh

            - name: Generate docs
              run: bun run build:docs

            - name: Validate pathKeys
              run: bun run validate:pathkeys

            - name: Lint
              run: bun run lint

            - name: Build
              run: bun run build
