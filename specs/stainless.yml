# yaml-language-server: $schema=https://app.stainless.com/config.schema.json
#
# Canonical public SDK Stainless config lives in the augno/core monorepo at:
#   ../api/stainless/public/stainless.yml
#
# `bun run scripts/generate-sdk-snippets.ts` loads that file automatically and merges a
# small docs overlay (sdk-json multi-language snippets). To point elsewhere:
#   PUBLIC_DOCS_STAINLESS_YML=/path/to/stainless.yml bun run scripts/generate-sdk-snippets.ts
#
# Keep this stub so schema-aware editors still have a file to attach to under specs/.

edition: '2026-02-23'
organization:
    name: augno

targets:
    typescript:
        package_name: '@augno/sdk'
